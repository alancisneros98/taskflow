services:

  # ── Base de datos de usuarios ──────────────────────────────────
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    ports:
      - "5432:5432" 
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Base de datos de tareas ────────────────────────────────────
  tasks-db:
    image: postgres:16-alpine
    container_name: tasks-db
    environment:
      POSTGRES_USER: ${TASKS_DB_USER}
      POSTGRES_PASSWORD: ${TASKS_DB_PASSWORD}
      POSTGRES_DB: ${TASKS_DB_NAME}
    volumes:
      - tasks-db-data:/var/lib/postgresql/data
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TASKS_DB_USER} -d ${TASKS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Message broker ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # puerto de mensajería
      - "15672:15672" # panel de administración web
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Auth Service ───────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_NAME: ${AUTH_DB_NAME}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - taskflow-network
    restart: unless-stopped

  # ── Notifications Service ──────────────────────────────────────
  notifications-service:
    build: ./notifications-service
    container_name: notifications-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - taskflow-network
    restart: unless-stopped

  # ── Tasks Service ──────────────────────────────────────
  tasks-service:
    build: ./tasks-service
    container_name: tasks-service
    environment:
      ASPNETCORE_URLS: http://+:3002
      ConnectionStrings__DefaultConnection: "Host=tasks-db;Port=5432;Database=${TASKS_DB_NAME};Username=${TASKS_DB_USER};Password=${TASKS_DB_PASSWORD}"
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    depends_on:
      tasks-db:
        condition: service_healthy
      rabbitmq:                        
        condition: service_healthy
    networks:
      - taskflow-network
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:3001
      TASKS_SERVICE_URL: http://tasks-service:3002
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3003
    depends_on:
      - auth-service
      - tasks-service
      - notifications-service
    networks:
      - taskflow-network
    restart: unless-stopped

# ── Volúmenes — persisten datos aunque el contenedor se elimine ──
volumes:
  auth-db-data:
  tasks-db-data:

# ── Red interna — los servicios se hablan por nombre ─────────────
networks:
  taskflow-network:
    driver: bridge